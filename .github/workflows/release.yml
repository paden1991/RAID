name: Publish WowUp Forever release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag to publish
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Verify and package reviewed runtime
        run: GITHUB_REF_NAME="$TAG" python3 tools/build_release.py
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_args=()
          if [[ "$TAG" == *-* ]]; then prerelease_args+=(--prerelease); fi
          gh release create "$TAG" dist/*-forever.zip dist/release.json dist/SHA256SUMS.txt --verify-tag --title "$TAG - WoW Forever" --notes-file RELEASE_NOTES.md "${prerelease_args[@]}"
